# The reference repeats "अहवाल" at the end of the district-page title; kept verbatim.
detail_title_mr: "{campaign} जिल्हानिहाय प्रसिद्धी अहवाल दि. {date} अहवाल"
total_label_mr: "एकूण"
serial_header_mr: "अ.क्र"
division_header_mr: "विभागाचे नाव"
