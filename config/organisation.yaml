    summary_label_mr: "मुंबई, मुख्यालय मंत्रालय"
    section_title_mr: "मुंबई"
    show_subtotal: false
    detail_page: 1
    offices:
      - {code: mumbai_hq, name_mr: "मुंबई, मुख्यालय मंत्रालय", name_en: "Mumbai, Headquarters (Mantralaya)", kind: headquarters}

