# Organisational registry: divisions and the offices/districts that report under them.
# Order here is the order used in every report, list and export. Codes are stable identifiers used by
# accounts, manual inputs and snapshots — do not rename a code once data exists.
#
# summary_label_mr : label used on page 1 (division-wise summary)
# section_title_mr : label used for the division band on the district pages
# show_subtotal    : whether the district pages show an "एकूण" row for the division
# detail_page      : which district page (1-based, after the summary page) the division is printed on
#
# Order and names as DGIPR asked for them (feedback of 29.10.2026): मुंबई मुख्यालय मंत्रालय first; then each
# division with its senior office first (संचालक, नागपूर / विमाका, पुणे …), then the district office of the same
# city (जिमाका, नागपूर / जिमाका, पुणे …), then the division's other districts. Names use the official short
# forms: विमाका = विभागीय माहिती कार्यालय, जिमाका = जिल्हा माहिती कार्यालय.

divisions:
