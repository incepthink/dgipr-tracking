# Organisational registry: divisions and the offices/districts that report under them.
# Order here is the order used in the report. Names are taken verbatim from the
# reference report (13.10.2026 for print.pdf). Codes are stable identifiers used by
# accounts, manual inputs and snapshots — do not rename a code once data exists.
#
# summary_label_mr : label used on page 1 (division-wise summary)
# section_title_mr : label used for the division band on the district pages
# show_subtotal    : whether the district pages show an "एकूण" row for the division
# detail_page      : which district page (1-based, after the summary page) the division is printed on
#
# Each division's विमाका (divisional information office) is listed first, matching the office data-entry
# sheet; its zone officer enters that row. The six added on 2026-10-17 (pune_rio … latur_rio) print as rows
# like nagpur_rio / konkan_rio already did — two extra rows per district page still fit on A4.

divisions:
  - code: nagpur
    summary_label_mr: "नागपूर विभाग"
    section_title_mr: "नागपूर विभाग"
    show_subtotal: true
    detail_page: 1
    offices:
      - {code: nagpur_rio, name_mr: "विमाका, नागपूर", name_en: "Divisional Information Office, Nagpur", kind: divisional_office}
